[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-ua-rotator"
version = "1.2.1"
description = "Framework-agnostic weighted User-Agent rotation with an optional Scrapy adapter"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{name = "ApexAI"}]
keywords = ["user-agent", "scrapy", "crawler", "http", "middleware"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
scrapy = ["Scrapy>=2.11,<3"]
test = ["pytest>=8", "coverage[toml]>=7"]

[project.scripts]
apex-ua-rotator = "apex_ua_rotator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["user_agent_rotator", "scrapy_user_agent_adapter"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apex_ua_rotator = ["py.typed", "user_agent_profiles.schema.json", "profiles/*.json", "profiles/*.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["apex_ua_rotator"]
omit = [
  "src/apex_ua_rotator/__main__.py",
  "src/apex_ua_rotator/smoke.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
