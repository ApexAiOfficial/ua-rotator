[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-ua-rotator"
dynamic = ["version"]
description = "Framework-agnostic weighted User-Agent rotation with an optional Scrapy adapter"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "ApexAi"}]
keywords = ["user-agent", "scrapy", "crawler", "http", "middleware", "rotation", "web-scraping"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Scrapy",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
scrapy = ["Scrapy>=2.11,<3"]
test = ["pytest>=8", "coverage[toml]>=7", "jsonschema>=4.18"]

[project.scripts]
apex-ua-rotator = "apex_ua_rotator.cli:main"

[project.urls]
Homepage = "https://apexaiofficial.com"
Repository = "https://github.com/ApexAiOfficial/ua-rotator"
Documentation = "https://github.com/ApexAiOfficial/ua-rotator#readme"
Changelog = "https://github.com/ApexAiOfficial/ua-rotator/blob/main/CHANGELOG.md"
Issues = "https://github.com/ApexAiOfficial/ua-rotator/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["user_agent_rotator", "scrapy_user_agent_adapter"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "apex_ua_rotator.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apex_ua_rotator = ["py.typed", "user_agent_profiles.schema.json", "profiles/*.json", "profiles/*.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["apex_ua_rotator"]
omit = [
  "src/apex_ua_rotator/__main__.py",
  "src/apex_ua_rotator/smoke.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "RUF"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP037", "RUF012", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "BLE001"]

[tool.mypy]
python_version = "3.10"
files = ["src/apex_ua_rotator"]
strict = true
warn_unreachable = true

# Scrapy is optional. CI type-checks against the real package (it ships
# py.typed); without it installed, these keep mypy usable locally.
[[tool.mypy.overrides]]
module = ["scrapy", "scrapy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apex_ua_rotator.smoke"]
disallow_subclassing_any = false
